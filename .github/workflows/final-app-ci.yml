name: Final App CI

on:
  push:
    branches:
      - main
      - final-battle-tested-2026-09-15
    paths:
      - 'final_app/**'
      - '.github/workflows/final-app-ci.yml'
  pull_request:
    paths:
      - 'final_app/**'
      - '.github/workflows/final-app-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: final_app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r final_app/requirements.txt pytest
      - name: Compile
        working-directory: final_app
        run: python -m py_compile property_system.py
      - name: Unit and regression tests
        working-directory: final_app
        run: pytest -q test_property_system.py
      - name: Import application
        working-directory: final_app
        run: python -c "import property_system; assert property_system.app is not None; print(property_system.APP_VERSION)"
